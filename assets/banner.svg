<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="accent-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; }
      .subtitle { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 18px; fill: #cbd5e1; }
      .tag { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 12px; fill: #a855f7; letter-spacing: 1.5px; }
      
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }
      @keyframes pulse {
        0% { opacity: 0.3; }
        50% { opacity: 0.8; }
        100% { opacity: 0.3; }
      }
      
      .floating-card-1 { animation: float 6s ease-in-out infinite; }
      .floating-card-2 { animation: float 8s ease-in-out infinite 1s; }
      .pulsing-glow { animation: pulse 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-gradient)"/>
  
  <!-- Subtle Background Grid/Nodes -->
  <g opacity="0.15">
    <circle cx="200" cy="80" r="3" fill="#ffffff"/>
    <circle cx="400" cy="220" r="4" fill="#ffffff"/>
    <circle cx="950" cy="70" r="3" fill="#ffffff"/>
    <circle cx="1050" cy="230" r="5" fill="#ffffff"/>
    <line x1="200" y1="80" x2="400" y2="220" stroke="#ffffff" stroke-width="1"/>
    <line x1="950" y1="70" x2="1050" y2="230" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Ambient Glow Behind Elements -->
  <circle cx="950" cy="150" r="180" fill="url(#accent-glow)" opacity="0.15" class="pulsing-glow"/>

  <!-- Background Animated Visual Elements (Right Side / Peripheral) -->
  <g class="floating-card-1">
    <!-- Talent Card -->
    <rect x="860" y="50" width="220" height="80" rx="12" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
    <circle cx="895" cy="90" r="18" fill="#6366f1" fill-opacity="0.3"/>
    <path d="M889 96 C889 90 892 86 895 86 C898 86 901 90 901 96" stroke="#6366f1" stroke-width="2" fill="none"/>
    <circle cx="895" cy="83" r="5" fill="#6366f1"/>
    <rect x="925" y="75" width="90" height="8" rx="4" fill="#ffffff" fill-opacity="0.8"/>
    <rect x="925" y="93" width="60" height="6" rx="3" fill="#94a3b8"/>
  </g>

  <g class="floating-card-2">
    <!-- Analytics / Payroll Card -->
    <rect x="800" y="160" width="240" height="90" rx="12" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
    <rect x="825" y="210" width="16" height="20" rx="3" fill="#a855f7"/>
    <rect x="850" y="195" width="16" height="35" rx="3" fill="#ec4899"/>
    <rect x="875" y="185" width="16" height="45" rx="3" fill="#6366f1"/>
    <rect x="905" y="185" width="110" height="8" rx="4" fill="#ffffff" fill-opacity="0.8"/>
    <rect x="905" y="203" width="75" height="6" rx="3" fill="#94a3b8"/>
  </g>

  <!-- Foreground Main Content (Left Aligned for absolute readability) -->
  <g transform="translate(70, 0)">
    <!-- Category Pill -->
    <rect x="0" y="55" width="220" height="26" rx="13" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-opacity="0.3"/>
    <text x="15" y="72" class="tag">ENTERPRISE &amp; OPEN SOURCE</text>

    <!-- Title -->
    <text x="0" y="130" class="title">Human Capital Management</text>
    
    <!-- Accent Line -->
    <rect x="0" y="145" width="480" height="4" rx="2" fill="url(#accent-glow)"/>

    <!-- Subtitle -->
    <text x="0" y="185" class="subtitle">Curated Ecosystem of SaaS Suites, Open-Source HRMS,</text>
    <text x="0" y="210" class="subtitle">Payroll Engines &amp; Employee Experience Platforms</text>
    
    <!-- Badges Row Preview -->
    <g transform="translate(0, 235)">
      <rect x="0" y="0" width="110" height="22" rx="4" fill="#1e293b"/>
      <text x="10" y="15" font-family="sans-serif" font-size="11" fill="#94a3b8">Core HR</text>
      <rect x="120" y="0" width="110" height="22" rx="4" fill="#1e293b"/>
      <text x="130" y="15" font-family="sans-serif" font-size="11" fill="#94a3b8">Payroll &amp; Benefits</text>
      <rect x="240" y="0" width="110" height="22" rx="4" fill="#1e293b"/>
      <text x="250" y="15" font-family="sans-serif" font-size="11" fill="#94a3b8">Talent Suites</text>
    </g>
  </g>
</svg>
